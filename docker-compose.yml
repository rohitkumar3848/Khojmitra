version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: khojmitra-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - khojmitra-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khojmitra-backend
    restart: always
    depends_on:
      - mongodb
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/khojmitra
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    networks:
      - khojmitra-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: khojmitra-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - khojmitra-net

volumes:
  mongo_data:

networks:
  khojmitra-net:
    driver: bridge
